name: Deploy mykiz.my

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # `cancel-in-progress: false` on purpose: cancelling mid-deploy can leave the
  # remote process orphaned while a new run races it on node_modules/.next.
  # GitHub already cancels superseded *pending* runs, so rapid pushes queue at
  # most one run deep. `scripts/remote-deploy.sh` also takes a flock guard.
  group: deploy
  cancel-in-progress: false

jobs:
  # Types are checked here (7 GB runner) because the 2 GB VPS can't run Next's
  # build-time TypeScript check without thrashing swap. The VPS build sets
  # `typescript.ignoreBuildErrors`; this job is what actually enforces types.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kiznext
      - run: npx next typegen
      - run: npx tsc --noEmit
      # The icon font is a committed subset — fail if the source references an
      # icon that isn't in it, so a new icon can never ship as raw text again.
      - run: npm run check:icons

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    # Fail fast: a bad build used to sit on `Creating an optimized production
    # build …` until the 30m SSH timeout. 15m is well above the ~2m happy path.
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 8m
          script: |
            sudo bash /home/mykiz.my/kiznext/scripts/remote-deploy.sh

name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query avatar urls
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            DB_URL=$(sudo grep '^DATABASE_URL=' /home/mykiz.my/kiznext/.env | head -1 | cut -d= -f2- | cut -d'?' -f1)
            echo "===== sanity: total users / users with avatar ====="
            psql "$DB_URL" -t -A -c "SELECT count(*) FROM users;"
            psql "$DB_URL" -t -A -c "SELECT count(*) FROM users WHERE avatar_url IS NOT NULL;"
            echo
            echo "===== distinct avatar_url values ====="
            psql "$DB_URL" -t -A -c "SELECT DISTINCT avatar_url FROM users WHERE avatar_url IS NOT NULL AND length(avatar_url) > 0;" | head -30
            echo
            echo "===== file check + curl for each ====="
            psql "$DB_URL" -t -A -c "SELECT DISTINCT avatar_url FROM users WHERE avatar_url IS NOT NULL AND length(avatar_url) > 0;" 2>/dev/null | while read -r url; do
              [ -z "$url" ] && continue
              REL="${url#/uploads/}"
              if [ -f "/home/mykiz.my/kiznext/public/uploads/$REL" ]; then
                echo "EXISTS: $url"
              else
                echo "MISSING: $url"
              fi
              echo "  curl -> HTTP $(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3010$url")"
            done

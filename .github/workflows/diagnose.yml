name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect server diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== A. .env raw format (values masked) ====="
            sudo sed -E 's/(=.{0,40}).*/\1…/' /home/mykiz.my/kiznext/.env
            echo
            echo "===== B. running node process environ: AUTH_URL present? ====="
            PID=$(sudo pgrep -f "next start" | head -1)
            echo "node PID: $PID"
            sudo tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep -E "^AUTH_URL|^NEXTAUTH_URL|^AUTH_SECRET|^DATABASE_URL" | sed -E 's/(=.{0,30}).*/\1…/'
            echo
            echo "===== C. what the proxy sends (via node listener) ====="
            sudo timeout 3 bash -c 'cat < /dev/tcp/127.0.0.1/3010 >/dev/null' 2>/dev/null; echo "(can't easily sniff headers this way)"
            echo
            echo "===== D. OpenLiteSpeed vhost rewrite/header rules ====="
            sudo grep -rniE "x-forwarded|proxy_set|extraHeader|add_header|Origin" /usr/local/lsws/conf/ 2>/dev/null | grep -iE "forwarded|origin|host" | head -20

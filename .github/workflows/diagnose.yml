name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query avatar urls via prisma
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== psql available? ====="
            which psql 2>&1 || echo "psql NOT found"
            echo
            echo "===== avatar urls via app prisma ====="
            sudo runuser -u mykiz7808 -- env HOME=/home/mykiz.my bash -lc 'cd /home/mykiz.my/kiznext && set -a && . ./.env && set +a && node -e "
              const { PrismaClient } = require(\"./app/generated/prisma/client.js\");
              const { PrismaPg } = require(\"@prisma/adapter-pg\");
              const pg = require(\"pg\");
              const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
              const prisma = new PrismaClient({ adapter: new PrismaPg(pool) });
              prisma.user.findMany({ where: { avatarUrl: { not: null } }, select: { matricId: true, role: true, avatarUrl: true } }).then(rows => {
                console.log(\"count:\", rows.length);
                for (const r of rows) console.log(JSON.stringify(r));
                process.exit(0);
              }).catch(e => { console.error(\"ERR:\", e.message); process.exit(1); });
            "' 2>&1 | head -40

name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect server diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== 1. AUTH_URL exact (host masked, structure visible) ====="
            sudo grep -E "AUTH_URL|NEXTAUTH_URL|NEXT_PUBLIC_SITE_URL" /home/mykiz.my/kiznext/.env 2>&1 | sed -E 's#(https?://)([^, ]+)#\1<host>#g'
            echo
            echo "===== 2. process.env of running service (AUTH_URL seen by node) ====="
            sudo systemctl show mykiznext -p Environment 2>&1 | tr ' ' '\n' | grep -iE "AUTH_URL|NEXTAUTH_URL|SITE_URL|AUTH_SECRET" | sed -E 's#(https?://)([^, ]+)#\1<host>#g'
            echo
            echo "===== 3. journalctl: request lines + Invalid URL context (method/url) ====="
            sudo journalctl -u mykiznext --no-pager 2>/dev/null | grep -B2 -A3 "Invalid URL" | grep -iE "POST|GET|PUT|Invalid URL|input:|/superadmin|/login|/api|urus-tetapan" | tail -60
            echo
            echo "===== 4. raw stack lines (non-ignore-listed) for last error ====="
            sudo journalctl -u mykiznext --no-pager 2>/dev/null | grep -A20 "Invalid URL" | grep -viE "ignore-listed|^\s*$|input:|code:" | tail -30

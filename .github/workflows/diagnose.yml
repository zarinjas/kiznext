name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect server diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== 1. .env files present? ====="
            ls -la /home/mykiz.my/kiznext/.env* 2>&1
            echo
            echo "===== 2. env var NAMES in .env (masked) ====="
            sed -E 's#=.*##' /home/mykiz.my/kiznext/.env 2>&1 | sort
            echo
            echo "===== 3. AUTH_URL / NEXTAUTH / SITE_URL values (host masked) ====="
            grep -E "AUTH_URL|NEXTAUTH_URL|NEXT_PUBLIC_SITE_URL|AUTH_TRUST" /home/mykiz.my/kiznext/.env 2>&1 | sed -E 's#(https?://[^/ ]+)#\1#' | sed -E 's#(https?://)[^, ]+#\1<host>#'
            echo
            echo "===== 4. systemd unit ====="
            cat /etc/systemd/system/mykiznext.service 2>&1
            echo
            echo "===== 5. systemd EnvironmentFile (if any) ====="
            for f in $(grep -oE "/[^ ]+" /etc/systemd/system/mykiznext.service 2>/dev/null | grep -i env); do echo "--- $f ---"; sed -E 's#=.*##' "$f" 2>/dev/null; done

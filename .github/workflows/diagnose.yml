name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check avatar URLs vs files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== 1. distinct avatarUrl values in DB ====="
            sudo bash -c 'set -a && . /home/mykiz.my/kiznext/.env && set +a && psql "$DATABASE_URL" -t -A -F" | " -c "SELECT DISTINCT \"avatarUrl\" FROM users WHERE \"avatarUrl\" IS NOT NULL;"' 2>&1 | head -30
            echo
            echo "===== 2. test each avatarUrl: file exists? + curl ====="
            AVATARS=$(sudo bash -c 'set -a && . /home/mykiz.my/kiznext/.env && set +a && psql "$DATABASE_URL" -t -A -c "SELECT DISTINCT \"avatarUrl\" FROM users WHERE \"avatarUrl\" IS NOT NULL;"' 2>/dev/null)
            echo "$AVATARS" | while read -r url; do
              [ -z "$url" ] && continue
              REL="${url#/uploads/}"
              if [ -f "/home/mykiz.my/kiznext/public/uploads/$REL" ]; then
                echo "FILE EXISTS: $url"
              else
                echo "FILE MISSING: $url"
              fi
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3010$url" 2>/dev/null)
              echo "  curl $url -> HTTP $code"
            done

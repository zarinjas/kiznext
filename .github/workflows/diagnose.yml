name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect server diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== 1. journalctl (last 120 lines, error/action markers) ====="
            journalctl -u mykiznext -n 120 --no-pager 2>/dev/null | grep -iE "error|action|origin|host|csrf|invalid|abort|settings|sharp|upload" | tail -80
            echo
            echo "===== 2. AUTH_URL in .env ====="
            grep -E "AUTH_URL" /home/mykiz.my/kiznext/.env 2>/dev/null | sed 's/=.*/=<set>/'
            echo
            echo "===== 3. deployed next.config (allowedOrigins present?) ====="
            grep -A4 "serverActions" /home/mykiz.my/kiznext/next.config.ts 2>/dev/null
            echo
            echo "===== 4. uploads dir perms ====="
            ls -ld /home/mykiz.my/kiznext/public/uploads 2>/dev/null
            echo
            echo "===== 5. sharp native module ====="
            ls -l /home/mykiz.my/kiznext/node_modules/sharp/build/Release/*.node 2>/dev/null || echo "no sharp native binary"
            cd /home/mykiz.my/kiznext && node -e "const s=require('sharp'); console.log('sharp version:', s.versions.sharp, '| vips:', s.versions.vips)" 2>&1 | head -5
            echo
            echo "===== 6. node + OS ====="
            node -v; ldd --version 2>/dev/null | head -1; uname -m

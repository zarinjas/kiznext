name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: List recent student uploads
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== uploads dirs ====="
            ls -la /home/mykiz.my/kiznext/public/uploads/ 2>/dev/null
            echo
            echo "===== fasiliti subdir (recent) ====="
            ls -lt /home/mykiz.my/kiznext/public/uploads/fasiliti/ 2>/dev/null | head -15
            echo
            echo "===== latest 5 upload files anywhere (validate) ====="
            find /home/mykiz.my/kiznext/public/uploads/ -type f -newermt "2026-09-03 18:00" 2>/dev/null | head -10
            echo
            echo "===== what does a student avatar URL resolve to? (curl via local) ====="
            AVATAR=$(find /home/mykiz.my/kiznext/public/uploads/fasiliti/ -type f -newermt "2026-09-03 18:00" 2>/dev/null | head -1)
            if [ -n "$AVATAR" ]; then
              FNAME=$(basename "$AVATAR")
              file "$AVATAR"
              stat -c "%s bytes" "$AVATAR"
              echo "curl test:"
              curl -s -o /dev/null -w "  HTTP %{http_code}, %{content_type}\n" "http://127.0.0.1:3010/uploads/fasiliti/$FNAME"
            fi

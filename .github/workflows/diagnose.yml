name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check avatar urls
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== distinct avatar_url in DB ====="
            sudo bash -c 'set -a && . /home/mykiz.my/kiznext/.env && set +a && psql "$DATABASE_URL" -t -A -F" | " -c "SELECT DISTINCT avatar_url FROM users WHERE avatar_url IS NOT NULL AND avatar_url <> chr(39)||chr(39);"' 2>&1 | grep -v "^$" | head -30
            echo
            echo "===== for each avatar_url: file + curl ====="
            sudo bash -c 'set -a && . /home/mykiz.my/kiznext/.env && set +a && psql "$DATABASE_URL" -t -A -c "SELECT DISTINCT avatar_url FROM users WHERE avatar_url IS NOT NULL;"' 2>/dev/null | while read -r url; do
              [ -z "$url" ] && continue
              REL="${url#/uploads/}"
              if [ -f "/home/mykiz.my/kiznext/public/uploads/$REL" ]; then
                echo "FILE EXISTS: $url"
              else
                echo "FILE MISSING: $url"
              fi
              echo "  curl -> HTTP $(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3010$url")"
            done

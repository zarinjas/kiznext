name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect server diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "===== 1. FULL stack trace of 'Invalid URL' error (last 200 lines) ====="
            journalctl -u mykiznext -n 200 --no-pager 2>/dev/null | grep -A40 "TypeError: Invalid URL" | tail -120
            echo
            echo "===== 2. AUTH_URL + all env keys (names only) ====="
            grep -oE "^[A-Z_]+" /home/mykiz.my/kiznext/.env 2>/dev/null | sort
            echo "--- AUTH_URL raw (masked value) ---"
            grep -E "AUTH_URL" /home/mykiz.my/kiznext/.env 2>/dev/null | sed -E 's#(https?://)[^/]*#\1<host>#'
            echo
            echo "===== 3. recent journalctl full tail (no grep) ====="
            journalctl -u mykiznext -n 60 --no-pager 2>/dev/null
